name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core only; tests don't need the pretrained models)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
