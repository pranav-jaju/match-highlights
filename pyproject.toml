[project]
name = "matchreel"
version = "0.1.0"
description = "Automatic sports highlight detection from match audio: sound-event and commentary models fused and evaluated against broadcaster highlights."
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "scipy",
    "pandas",
    "scikit-learn>=1.9,<1.10",  # the shipped model was trained with 1.9
    "librosa",
    "soundfile",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
models = ["torch>=2.2", "torchaudio>=2.2", "panns-inference", "openai-whisper"]
app = ["streamlit"]
dev = ["pytest"]

[project.scripts]
matchreel = "matchreel.cli:main"

[tool.setuptools]
packages = ["matchreel", "matchreel.signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
